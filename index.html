<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Clone</title>
    <style>
        /* СТИЛИ ДЛЯ ДИЗАЙНА (CSS) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Roboto, Arial, sans-serif;
        }

        body {
            background-color: #0f0f0f;
            color: #fff;
            overflow-x: hidden;
        }

        /* Шапка сайта */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 56px;
            background-color: #0f0f0f;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            z-index: 100;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            font-weight: bold;
            font-size: 20px;
            letter-spacing: -1px;
            display: flex;
            align-items: center;
        }

        .logo span {
            background-color: red;
            color: white;
            padding: 2px 6px;
            border-radius: 6px;
            margin-right: 4px;
            font-size: 14px;
        }

        .search-section {
            display: flex;
            align-items: center;
            width: 40%;
            max-width: 600px;
        }

        .search-bar {
            width: 100%;
            height: 40px;
            background-color: #121212;
            border: 1px solid #303030;
            border-radius: 40px 0 0 40px;
            padding: 0 16px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .search-bar:focus {
            border-color: #1c62b9;
        }

        .search-btn {
            height: 40px;
            width: 64px;
            background-color: #222222;
            border: 1px solid #303030;
            border-left: none;
            border-radius: 0 40px 40px 0;
            color: white;
            cursor: pointer;
        }

        /* Главный контейнер */
        .main-container {
            display: flex;
            margin-top: 56px;
        }

        /* Боковое меню */
        aside {
            width: 240px;
            height: calc(100vh - 56px);
            position: fixed;
            top: 56px;
            left: 0;
            padding: 12px;
            background-color: #0f0f0f;
        }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 4px;
        }

        .menu-item:hover, .menu-item.active {
            background-color: #272727;
        }

        /* Сетка с видео */
        main {
            margin-left: 240px;
            padding: 24px;
            width: calc(100% - 240px);
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            row-gap: 40px;
        }

        .video-card {
            cursor: pointer;
            background: none;
            border: none;
            text-align: left;
            color: white;
            width: 100%;
        }

        .thumbnail {
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #272727;
            border-radius: 12px;
            margin-bottom: 12px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .video-info {
            display: flex;
            gap: 12px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            background-color: #555;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .video-details .title {
            font-size: 16px;
            font-weight: 500;
            line-height: 22px;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-details .author, .video-details .views {
            font-size: 14px;
            color: #aaa;
        }

        /* Адаптивность для мобилок */
        @media (max-width: 768px) {
            aside { display: none; }
            main { margin-left: 0; width: 100%; padding: 12px; }
            .search-section { width: 60%; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-section">
            <div class="logo"><span>YouTube</span>Блог</div>
        </div>
        <div class="search-section">
            <input type="text" class="search-bar" id="searchInput" placeholder="Введите запрос...">
            <button class="search-btn" onclick="searchVideo()">🔍</button>
        </div>
        <div style="width: 40px;"></div>
    </header>

    <div class="main-container">
        <aside>
            <div class="menu-item active">🏠 Главная</div>
            <div class="menu-item">🩳 Shorts</div>
            <div class="menu-item">📁 Подписки</div>
            <hr style="border: 1px solid #272727; margin: 12px 0;">
            <div class="menu-item">📚 Библиотека</div>
            <div class="menu-item">⏱️ История</div>
        </aside>

        <main>
            <div class="video-grid" id="videoGrid">
                </div>
        </main>
    </div>

    <script>
        // База данных наших "видеороликов"
        const videosData = [
            { title: "Как создать свой первый сайт с нуля за 10 минут", author: "Веб Академия", views: "150 тыс. просмотров", icon: "💻" },
            { title: "Топовые фишки в Roblox Studio, о которых никто не говорит", author: "Roblox Maker", views: "42 тыс. просмотров", icon: "🎮" },
            { title: "Обзор самого мощного компа 2026 года", author: "ТехноБлог", views: "1.2 млн просмотров", icon: "🖥️" },
            { title: "Музыка для концентрации и кодинга lo-fi", author: "Chill Station", views: "800 тыс. просмотров", icon: "🎵" },
            { title: "Как залить проект на GitHub через телефон", author: "DevPro", views: "15 тыс. просмотров", icon: "📱" },
            { title: "История создания YouTube и секреты алгоритмов", author: "МедиаГик", views: "310 тыс. просмотров", icon: "📺" }
        ];

        const videoGrid = document.getElementById('videoGrid');

        // Функция, которая отрисовывает карточки видео на страницу
        function renderVideos(videos) {
            videoGrid.innerHTML = ""; // очищаем сетку перед выводом
            
            if(videos.length === 0) {
                videoGrid.innerHTML = "<p style='grid-column: 1/-1; text-align:center; color: #aaa;'>Ничего не найдено :(</p>";
                return;
            }

            videos.forEach(video => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <div class="thumbnail">${video.icon}</div>
                    <div class="video-info">
                        <div class="avatar"></div>
                        <div class="video-details">
                            <div class="title">${video.title}</div>
                            <div class="author">${video.author}</div>
                            <div class="views">${video.views}</div>
                        </div>
                    </div>
                `;
                // Клик по видео вызовет уведомление
                card.onclick = () => alert(`Вы открыли видео: "${video.title}"`);
                videoGrid.appendChild(card);
            });
        }

        // Логика работы поисковой строки
        function searchVideo() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filteredVideos = videosData.filter(video => 
                video.title.toLowerCase().includes(query) || 
                video.author.toLowerCase().includes(query)
            );
            renderVideos(filteredVideos);
        }

        // Поиск при нажатии клавиши Enter
        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchVideo();
            }
        });

        // Первая загрузка всех видео при открытии сайта
        renderVideos(videosData);
    </script>
</body>
</html>
